/**:
  ros__parameters:
    # Path follower type (legacy: "pure_pursuit", "dwa", "simple")
    path_follower_type: "pure_pursuit"

    # Legacy parameters (used by original NavigationStack)
    lookahead_distance: 0.8
    max_linear_velocity: 1.75
    goal_tolerance: 0.25
    path_resolution: 0.1
    update_frequency: 10.0  # Hz

    # Topics
    cmd_vel_topic: "/prometheus/cmd_vel"
    odom_topic: "/prometheus/odom"
    goal_topic: "goal_pose"
    scan_topic: "/prometheus/scan"

    # ── Nav2 Rust Stack Parameters ────────────────────────────

    # Global planner (NavFn)
    planner:
      use_astar: true
      allow_unknown: true
      tolerance: 0.0

    # Local controller (Regulated Pure Pursuit)
    controller:
      max_linear_vel: 0.5
      min_linear_vel: 0.05
      max_angular_vel: 1.0
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead: true
      use_cost_regulated_linear_velocity: true
      use_approach_vel_scaling: true
      approach_velocity_scaling_dist: 0.6
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785  # pi/4

    # Smoother (Simple)
    smoother:
      max_iterations: 1000
      w_smooth: 0.4
      w_data: 0.5
      tolerance: 0.00001
      do_refinement: true

    # Costmap
    costmap:
      width: 200       # cells
      height: 200      # cells
      resolution: 0.05  # m/cell
      inflation_radius: 0.55
      cost_scaling_factor: 3.0
      lethal_threshold: 65
      track_unknown: true

    # Recovery behaviors
    behaviors:
      spin:
        target_yaw: 1.57  # pi/2
        angular_velocity: 1.0
      backup:
        target_distance: 0.3
        linear_velocity: -0.1
      wait:
        duration: 5.0  # seconds

/prometheus_navigation_node:
  ros__parameters:
    lookahead_distance: 0.8
    max_linear_velocity: 1.75
    goal_tolerance: 0.25
    path_resolution: 0.1
    update_frequency: 10.0
    cmd_vel_topic: "/prometheus/cmd_vel"
    odom_topic: "/prometheus/odom"
    goal_topic: "goal_pose"
    scan_topic: "/prometheus/scan"
